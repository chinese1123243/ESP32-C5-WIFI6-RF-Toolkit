name: 离线校验

# 不插板能跑的检查都在这里。
#
# 需要硬件的不进 CI：selftest_b4 / test_inject / test_sweep 都要串口，
# 靠本地跑，见 CONTRIBUTING.md。
#
# APK 也不在这里构建：Capacitor 的 Android 产物要 JDK 加 Android SDK，
# 跑一次十几分钟，收益配不上。前端正确性由下面三个 node 校验覆盖。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  protocol:
    name: 协议与前端校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: NUS 二进制帧协议
        run: node tools/nus_test.js

      - name: META 输出协议
        run: node tools/proto_test.js

      - name: 固件与前端一致性
        run: node tools/ui_check.js

  scripts:
    name: 脚本可编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 安装脚本依赖
        run: pip install -r scripts/requirements.txt

      - name: 编译全部脚本
        run: python -m compileall -q scripts tools

  arch:
    name: 架构红线
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 棘轮闸门: 命令名唯一性必须为 0; 行数 / META 处数 / 反向依赖不许变差.
      # 每还掉一笔欠账, 就把 scripts/arch_check.py 里的基线数字下调.
      - name: 架构红线
        run: python scripts/arch_check.py

  slop:
    name: 注释质量扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 只报告不拦，退出码恒为 0。看输出里的命中数即可。
      - name: 扫描 AI 味注释
        run: python scripts/check_slop.py

  host:
    name: 主机端纯逻辑单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 纯逻辑单元不依赖 ESP-IDF, 用系统 gcc 直接编.
      # 每加一项单测就改 test/host/run_all.sh 里的一行, CI 跟着自动覆盖.
      - name: 跑 test/host
        run: bash test/host/run_all.sh

      # C 实现与 chan_sim.py 的公式逐点比对 (750 点).
      # 依赖上一步产出的 build/host/chan_dump.
      - name: 信道调度与仿真公式一致
        run: python scripts/chan_cross.py
